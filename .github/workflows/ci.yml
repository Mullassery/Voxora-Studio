name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator:
    name: Orchestrator (Python 3.9)
    # ubuntu-latest (26.04) no longer ships Python 3.9.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voxora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install
        run: |
          pip install fastapi==0.115.* uvicorn==0.32.* httpx==0.28.* pydantic==2.9.* "cryptography>=42" "psycopg[binary]==3.2.*" pytest==8.* ruff==0.17.* mypy==1.19.*
      - name: Build voice bridge wheel (PyO3)
        run: |
          pip install "maturin>=1.5,<2"
          cd crates/voice-runtime
          maturin build --release
          pip install target/wheels/*.whl
      - name: Ruff
        run: ruff check services
      - name: Mypy
        run: mypy services/orchestrator/src services/ai-runtime/src
        env:
          MYPYPATH: ${{ github.workspace }}/services/orchestrator/src
      - name: Tests (orchestrator, SQLite + Postgres)
        run: pytest services/orchestrator/tests -q
        env:
          VOXORA_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/voxora_ci
      - name: Tests (ai-runtime)
        run: pytest services/ai-runtime/tests -q

  voice-runtime:
    name: Voice runtime (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  console:
    name: Operator console (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
