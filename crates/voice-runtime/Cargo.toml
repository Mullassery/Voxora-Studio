[package]
name = "voxora-voice-runtime"
description = "Deterministic turn-taking, scripted bridge, and WAV inspection for Voxora Studio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[features]
# Gated PyO3 bindings so plain `cargo build`/`cargo test` never needs pyo3;
# maturin builds the python extension with --features pyo3-bindings.
pyo3-bindings = ["dep:pyo3"]

[dependencies.pyo3]
version = "0.23"
optional = true
features = ["extension-module", "abi3-py39"]

[lib]
crate-type = ["rlib", "cdylib"]
