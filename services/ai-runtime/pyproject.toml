[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxora-ai-runtime"
version = "0.1.0"
description = "Deterministic mock AI agent runtime contract for Voxora Studio"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045", "UP037", "B008", "E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
